name: Release macOS installer
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./test.sh
      - name: Test upgrade from the pre-installer layout
        run: |
          ./build.sh
          dest="$HOME/Library/Input Methods/TypeBlend.app"
          mkdir -p "$(dirname "$dest")"
          ditto build/TypeBlend.app "$dest"
          ./Packaging/package.sh "${GITHUB_REF_NAME#v}"
          installer -pkg build/TypeBlend.pkg -target CurrentUserHomeDirectory
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$dest/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          codesign --verify --strict "$dest"
      - name: Publish community installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          shasum -a 256 TypeBlend.pkg > TypeBlend.pkg.sha256
          gh release create "$GITHUB_REF_NAME" TypeBlend.pkg TypeBlend.pkg.sha256 --verify-tag --generate-notes --title "TypeBlend ${GITHUB_REF_NAME#v}" --notes "Apple Silicon community build. The installer is unsigned and has not been notarized by Apple. See the installation instructions in the repository README."
